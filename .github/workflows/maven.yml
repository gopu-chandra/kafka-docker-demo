# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: kafka-docker-cicd-test

# When the workflow runs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

# Cancel an older run on the same branch when a newer commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Flow:
#   build ──┬──> dast ──┐
#   sast  ──┴───────────┴──> docker (push image only if everything passed)

jobs:
  # ---------- Job 1: compile, test, and package the JAR ----------
  build:
    name: Build and test (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven             # reuse downloaded dependencies between runs

      - name: Build and run tests
        run: mvn -B verify         # -B = batch mode, cleaner logs in CI

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kafka-demo-jar
          path: target/*.jar
          retention-days: 7

  # ---------- Job 2: SAST - scan the source code with CodeQL ----------
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write       # lets CodeQL post findings to the Security tab

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual       # CodeQL watches our own Maven build
          queries: security-extended   # broader set of security checks

      - name: Compile for analysis
        run: mvn -B -DskipTests compile

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  # ---------- Job 3: DAST - attack the running app with OWASP ZAP ----------
  dast:
    name: DAST (OWASP ZAP)
    needs: build                   # no point scanning if the build is broken
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Start Kafka and the app
        run: docker compose up -d --build kafka app

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ || true)
            if [ "$code" != "000" ]; then
              echo "App is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 5
          done
          echo "App did not start in time"
          exit 1

      - name: Send a sample order (gives ZAP real traffic to look at)
        run: |
          curl -s -X POST http://localhost:8081/orders \
            -H "Content-Type: application/json" \
            -d '{"product":"Laptop","quantity":1,"price":999.99}'

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8081"
          allow_issue_writing: false   # report as an artifact, don't open GitHub issues
          fail_action: false           # set to true to fail the build on warnings
          artifact_name: zap-report

      - name: Show app logs if something failed
        if: failure()
        run: docker compose logs app kafka

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ---------- Job 4: build the Docker image (push only from main) ----------
  docker:
    name: Build Docker image
    needs: [build, sast, dast]     # runs only if build and both scans passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # needed to push to GitHub Container Registry

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
            
      - name: Set up QEMU                      # ← new: lets the runner build for other chips
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # ← new: build both versions
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha     # reuse Docker layers between runs
          cache-to: type=gha,mode=max